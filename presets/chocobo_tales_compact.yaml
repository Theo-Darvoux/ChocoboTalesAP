# Chocobo Tales: a shorter game with monster Card Packs and fewer checks.
# Copy one preset to Archipelago's Players folder, set your name, and change the options to taste.
# 84 checks, about 40% filler, none of them after the ending.
name: Player{number}
game: Chocobo Tales
description: Chocobo Tales, compact settings with Card Packs

Chocobo Tales:
  progression_balancing: 50
  accessibility: full

  # story_complete: beat the story (the ending plays after the last Bebuzzu duel).
  # chocobo_rescue, card_collection, storybook_goals, gold_medals: reach the count set below.
  goal: story_complete
  chocobos_required: 12          # 1-15, for chocobo_rescue
  cards_required: 100            # 1-127, for card_collection; counts the cards inside packs
  storybook_goals_required: 24   # 1-32 here (2 storybook checks per book)
  gold_medals_required: 15       # 1-23, for gold_medals

  # Duels after the tutorial need a 15-card deck. Logic expects this many more cards per later chapter.
  cards_per_chapter: 4           # 0-15
  starting_cards: 15             # 0-40; rounds up to whole packs
  starting_chocobos: 0           # 0-15
  open_storybook_modes: false    # true: start with every storybook's battle and trial modes

  # Items
  card_packs: true               # 26 monster Card Packs instead of 127 cards
  shuffle_epilogues: false       # true: 48 storybook epilogues become items

  # Checks
  storybook_goals_per_book: 2    # 32 storybook checks
  microgame_medals: silver       # 23 checks
  field_card_checks: true        # 9 checks
  chocobo_rescue_checks: true    # 15 checks
  card_gift_checks: false        # true: 27 more checks, which logic only expects after the ending
  duel_s_rank_checks: false      # 8 boss duel win checks
  # The 5 chapter checks are always on.
